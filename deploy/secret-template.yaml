# TEMPLATE ONLY. This file is intentionally not a real Secret: never commit a
# token. Create the real one from a local file, as the README explains:
#
#   oc create secret generic httpflip-auth --from-file=tokens=./tokens
#
# The shape of the file, one credential per line:
#
#   # name        secret (openssl rand -hex 32)   expiry (RFC3339 or "-")
#   uploader-01   9f2c1a3d...                     -
#   uploader-02   a41b7e88...                     2027-03-01T00:00:00Z
#
# The trailing comment form is also accepted.
#
# The value below is deliberately NOT a valid credential. Applying this file
# unchanged leaves the service unable to parse its token file, so it refuses
# to start instead of coming up with a secret everyone can read. Replace the
# placeholder with real lines before applying, or create the Secret from a
# file with `oc create secret generic` as shown above.
apiVersion: v1
kind: Secret
metadata:
  name: httpflip-auth
type: Opaque
stringData:
  tokens: |
    uploader-01  <64-hex-chars-from-openssl-rand-hex-32>  -
